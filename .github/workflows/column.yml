name: Daily Column

on:
  schedule:
    - cron: "17 6 * * *"   # 目標 15:17 JST (06:17 UTC)。schedule遅延のバッファとして早めに設定
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Refresh feeds
        run: npm run fetch

      - name: Generate column
        env:
          # OPENAI_API_KEY があればそちらを優先。無ければ GEMINI_API_KEY(無料)。
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          COLUMN_COUNT: ${{ vars.COLUMN_COUNT }}              # 未設定なら 4
          COLUMN_BROAD_COUNT: ${{ vars.COLUMN_BROAD_COUNT }}  # うち横断テーマの本数。未設定なら 2
        run: node scripts/generate-column.mjs

      - name: Commit data
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/_data/articles.json src/_data/columns.json
          if git diff --staged --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "chore: daily column + feeds"
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing on remote (attempt $i)"
            git pull --rebase -X theirs origin main || true
          done
          echo "commit push failed; build/deploy will still include the new column"

      - name: Build site
        run: npx eleventy

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
